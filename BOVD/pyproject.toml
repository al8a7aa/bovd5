[project]
name = "bovd"
version = "0.9.0"
description = "BÖVD – astronaut health decision-support prototype (NASA Space Apps 2026). Not a medical device."
requires-python = ">=3.10"
keywords = ["nasa-space-apps-2026", "astronaut-health", "ai-assisted"]  # AI use: see README "Use of AI tools"
dependencies = []            # standard library only
[project.optional-dependencies]
fast-crypto = ["cryptography>=41"]
dev = ["pytest>=8"]

[tool.ruff]
line-length = 130
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "I"]
ignore = ["S101", "S311", "S608", "B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
